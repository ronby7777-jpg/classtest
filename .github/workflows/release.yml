name: Publish Windows desktop pet
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pnpm
        run: npm install --global pnpm@11.19.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm test
      - name: Build Windows packages
        run: pnpm exec electron-builder --win portable zip --x64 --publish never
      - name: Publish download
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.2.1 --repo "$env:GITHUB_REPOSITORY" 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload v1.2.1 release/Pocket-Pet-1.2.1.exe release/Pocket-Pet-1.2.1-x64.zip --clobber --repo "$env:GITHUB_REPOSITORY"
          } else {
            gh release create v1.2.1 release/Pocket-Pet-1.2.1.exe release/Pocket-Pet-1.2.1-x64.zip --target "$env:GITHUB_SHA" --title "Pocket Pet 1.2.1 · Windows 桌寵" --notes "建議下載 Pocket-Pet-1.2.1-x64.zip 並全部解壓縮，雙擊 Pocket Pet.exe 啟動；只需解壓縮一次。新增固定側邊與右鍵繼續散步控制、分別保存位置與散步狀態、修正設定視窗顯示與最小化恢復，並加入透明角色圖示。單檔 EXE 仍提供，但每次啟動需要解壓縮。" --repo "$env:GITHUB_REPOSITORY"
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
