name: Publish Windows desktop pet
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pnpm
        run: npm install --global pnpm@11.19.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm test
      - name: Build portable EXE
        run: pnpm exec electron-builder --win portable --x64 --publish never
      - name: Publish download
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.1.0 --repo "$env:GITHUB_REPOSITORY" 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload v1.1.0 release/Pocket-Pet-1.1.0.exe --clobber --repo "$env:GITHUB_REPOSITORY"
          } else {
            gh release create v1.1.0 release/Pocket-Pet-1.1.0.exe --target "$env:GITHUB_SHA" --title "Pocket Pet 1.1.0 · Windows 桌寵" --notes "下載 Pocket-Pet-1.1.0.exe 後雙擊即可使用，不需要安裝 Node.js 或 Codex。新增番茄鐘、專注／休息循環、桌寵倒數與系統通知；預設使用 HiPaint 走路動畫及第一幀靜態圖片。" --repo "$env:GITHUB_REPOSITORY"
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
